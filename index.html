<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>กรอกสกอร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --green: #0B6E4F; --bg: #F3F6F5; --text: #1F2937; --muted: #6B7280; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: 'Prompt', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--green); color: #fff; padding: 18px 20px 22px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  main { padding: 16px; max-width: 480px; margin: -10px auto 0; }
  .card { background: #fff; border-radius: 16px; padding: 18px 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 6px; }
  .team { text-align: center; }
  .logo { width: 72px; height: 72px; margin: 0 auto 6px; border-radius: 50%; object-fit: contain; background: #fff; }
  .logo.fallback { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 14px; }
  select { width: 100%; font: inherit; font-weight: 600; font-size: 16px; text-align: center; text-align-last: center;
    border: 2px solid currentColor; border-radius: 10px; padding: 6px 4px; background: #fff; appearance: none; }
  .stepper { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 14px; }
  .stepper button { width: 64px; height: 44px; border-radius: 12px; border: none; font-size: 26px; font-weight: 700;
    background: #E8F5EF; color: var(--green); }
  .stepper button:active { transform: scale(.95); }
  .stepper input { width: 84px; height: 72px; text-align: center; font: inherit; font-size: 44px; font-weight: 700;
    border: 2px solid #E5E7EB; border-radius: 14px; color: var(--text); }
  .stepper input:focus { outline: none; border-color: var(--green); }
  .vs { align-self: center; margin-top: 150px; font-size: 28px; font-weight: 700; color: var(--muted); }
  .verdict { text-align: center; margin: 18px 0 0; font-size: 16px; font-weight: 600; min-height: 24px; }
  .submit { display: block; width: 100%; margin-top: 16px; padding: 16px; border: none; border-radius: 14px;
    background: var(--green); color: #fff; font: inherit; font-size: 18px; font-weight: 600; }
  .submit:disabled { background: #9CA3AF; }
  .note { text-align: center; color: var(--muted); font-size: 12px; margin-top: 10px; }
  .error { background: #FEE2E2; color: #991B1B; border-radius: 12px; padding: 12px; font-size: 14px; margin-top: 12px; display: none; }
</style>
</head>
<body>
<header>
  <h1>⚽ กรอกสกอร์</h1>
  <p>พิมพ์ตัวเลข หรือกด + / − ได้เลย</p>
</header>
<main>
  <div class="card">
    <div class="teams">
      <div class="team" id="teamA"></div>
      <div class="vs">:</div>
      <div class="team" id="teamB"></div>
    </div>
    <div class="verdict" id="verdict"></div>
  </div>
  <button class="submit" id="submit" disabled>กำลังโหลด…</button>
  <div class="note">บันทึกแล้วจะมีข้อความ “สกอร์ …” ขึ้นในกลุ่มในชื่อของคุณ</div>
  <div class="error" id="error"></div>
</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ⚠️ ใส่ LIFF ID ของคุณตรงนี้ (ได้จาก LINE Developers → LINE Login channel → แท็บ LIFF)
const LIFF_ID = '2012091007-m4HrJQF5';

const state = { teams: [], a: '', b: '', ga: 0, gb: 0, colors: {}, logos: {} };

function q(name) { return new URLSearchParams(location.search).get(name) || ''; }
function showError(msg) { const e = document.getElementById('error'); e.textContent = msg; e.style.display = 'block'; }

function readParams() {
  // teams=ชื่อ~สี~โลโก้|ชื่อ~สี~โลโก้|...  a,b = ทีมที่เลือกไว้  ga,gb = สกอร์เริ่มต้น
  q('teams').split('|').filter(Boolean).forEach(function (t) {
    const p = t.split('~');
    state.teams.push(p[0]);
    state.colors[p[0]] = p[1] || '#0B6E4F';
    state.logos[p[0]] = p[2] || '';
  });
  state.a = q('a') || state.teams[0] || '';
  state.b = q('b') || state.teams[1] || '';
  state.ga = Number(q('ga')) || 0;
  state.gb = Number(q('gb')) || 0;
}

function teamBlock(side) {
  const name = state[side];
  const color = state.colors[name] || '#0B6E4F';
  const logo = state.logos[name];
  const el = document.getElementById(side === 'a' ? 'teamA' : 'teamB');
  const opts = state.teams.map(function (t) {
    return '<option' + (t === name ? ' selected' : '') + '>' + t + '</option>';
  }).join('');
  el.innerHTML =
    (logo ? '<img class="logo" src="' + logo + '" alt="">' :
      '<div class="logo fallback" style="background:' + color + '">' + name.slice(0, 5) + '</div>') +
    '<select style="color:' + color + '">' + opts + '</select>' +
    '<div class="stepper">' +
      '<button type="button" data-d="1">+</button>' +
      '<input type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="99" value="' + state['g' + side] + '">' +
      '<button type="button" data-d="-1">−</button>' +
    '</div>';
  el.querySelector('select').onchange = function (e) { state[side] = e.target.value; render(); };
  el.querySelectorAll('button').forEach(function (btn) {
    btn.onclick = function () {
      state['g' + side] = Math.max(0, Math.min(99, state['g' + side] + Number(btn.dataset.d)));
      el.querySelector('input').value = state['g' + side];
      verdict();
    };
  });
  const input = el.querySelector('input');
  input.onfocus = function () { input.select(); };
  input.oninput = function () {
    const v = parseInt(input.value, 10);
    state['g' + side] = isNaN(v) ? 0 : Math.max(0, Math.min(99, v));
    verdict();
  };
}

function verdict() {
  const v = document.getElementById('verdict');
  const btn = document.getElementById('submit');
  if (state.a === state.b) {
    v.textContent = 'เลือกทีมให้ไม่ซ้ำกันนะครับ'; v.style.color = '#B91C1C';
    btn.disabled = true; btn.textContent = '✅ บันทึกสกอร์'; return;
  }
  if (state.ga === state.gb) { v.textContent = '🤝 เสมอ'; v.style.color = 'var(--text)'; }
  else {
    const w = state.ga > state.gb ? state.a : state.b;
    v.textContent = '🏆 ' + w + ' ชนะ'; v.style.color = state.colors[w] || 'var(--green)';
  }
  btn.disabled = false;
  btn.textContent = '✅ บันทึก ' + state.a + ' ' + state.ga + '-' + state.gb + ' ' + state.b;
}

function render() { teamBlock('a'); teamBlock('b'); verdict(); }

document.getElementById('submit').onclick = function () {
  const btn = this;
  btn.disabled = true; btn.textContent = 'กำลังส่ง…';
  const msg = 'สกอร์ ' + state.a + ' ' + state.ga + '-' + state.gb + ' ' + state.b;
  liff.sendMessages([{ type: 'text', text: msg }])
    .then(function () { liff.closeWindow(); })
    .catch(function (err) {
      showError('ส่งไม่สำเร็จ: ' + err.message + '\nลองเปิดจากปุ่มในกลุ่มไลน์อีกครั้ง');
      verdict();
    });
};

liff.init({ liffId: LIFF_ID })
  .then(function () {
    readParams();   // อ่านหลัง init เพราะ LIFF จะคืนค่า query ให้หลัง init เสร็จ
    if (!liff.isInClient()) showError('หน้านี้ต้องเปิดจากปุ่ม “กรอกสกอร์” ในกลุ่มไลน์เท่านั้น');
    if (state.teams.length < 2) { showError('ไม่พบรายชื่อทีม ลองกดปุ่มกรอกสกอร์จากการ์ดผลในกลุ่มอีกครั้ง'); return; }
    render();
  })
  .catch(function (err) { showError('เปิดหน้าไม่สำเร็จ: ' + err.message); });
</script>
</body>
</html>
